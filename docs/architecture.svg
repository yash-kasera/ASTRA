<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- Central -->
  <rect x="170" y="16" width="560" height="112" rx="10" fill="#1e3a5f"/>
  <text x="450" y="42" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">CENTRAL CONTROL ROOM (Exam Authority)</text>
  <text x="450" y="66" fill="#cbd5e1" font-size="12.5" text-anchor="middle">Exam authority dashboard · Problem tracking · Decision help · Messages</text>
  <text x="450" y="86" fill="#cbd5e1" font-size="12.5" text-anchor="middle">AI assistant (runs locally) · Risk reports · Evidence store · Public status page</text>
  <text x="450" y="108" fill="#93c5fd" font-size="12" text-anchor="middle">Main site + backup site</text>

  <!-- uplink labels -->
  <line x1="200" y1="192" x2="200" y2="132" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="700" y1="192" x2="700" y2="132" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="450" y="160" fill="#334155" font-size="12" text-anchor="middle">Secure one-way internet link: the centre calls out, nothing can call in</text>
  <text x="450" y="176" fill="#334155" font-size="12" text-anchor="middle">(sends updates about once a minute · can be switched off during the exam)</text>

  <!-- Centre A -->
  <rect x="20" y="192" width="420" height="350" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="230" y="214" fill="#0f172a" font-size="14.5" font-weight="700" text-anchor="middle">EXAMINATION CENTRE (runs fully offline)</text>

  <rect x="40" y="226" width="380" height="96" rx="8" fill="#0f766e"/>
  <text x="230" y="248" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Centre server — main + backup</text>
  <text x="230" y="268" fill="#ccfbf1" font-size="12" text-anchor="middle">Keeps the official exam clock · Stores answer backups</text>
  <text x="230" y="285" fill="#ccfbf1" font-size="12" text-anchor="middle">Fast on-site AI · Centre admin dashboard</text>
  <text x="230" y="302" fill="#ccfbf1" font-size="12" text-anchor="middle">Own battery backup · backup server on separate power</text>

  <!-- machines -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="40" y="370" width="110" height="62" rx="7" fill="#fff" stroke="#0f766e"/>
    <text x="95" y="392" fill="#0f172a" font-weight="700">Exam machine</text>
    <text x="95" y="408" fill="#334155">locked-down</text>
    <text x="95" y="423" fill="#334155">answers on disk</text>
    <rect x="175" y="370" width="110" height="62" rx="7" fill="#fff" stroke="#0f766e"/>
    <text x="230" y="392" fill="#0f172a" font-weight="700">Exam machine</text>
    <text x="230" y="408" fill="#334155">locked-down</text>
    <text x="230" y="423" fill="#334155">answers on disk</text>
    <rect x="310" y="370" width="110" height="62" rx="7" fill="#fff" stroke="#0f766e" stroke-dasharray="5 3"/>
    <text x="365" y="392" fill="#0f172a" font-weight="700">Spare machine</text>
    <text x="365" y="408" fill="#334155">continue here</text>
    <text x="365" y="423" fill="#334155">same answers + time</text>
  </g>
  <line x1="95" y1="368" x2="150" y2="324" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="230" y1="368" x2="230" y2="324" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="365" y1="368" x2="310" y2="324" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="238" y="339" width="180" height="17" fill="#f1f5f9"/><text x="328" y="352" fill="#334155" font-size="11" text-anchor="middle">private, encrypted exam network</text>

  <rect x="40" y="450" width="185" height="78" rx="7" fill="#fef3c7" stroke="#d97706"/>
  <text x="132" y="472" fill="#78350f" font-size="12.5" font-weight="700" text-anchor="middle">Invigilator room view</text>
  <text x="132" y="490" fill="#78350f" font-size="11.5" text-anchor="middle">seat map · approvals</text>
  <text x="132" y="506" fill="#78350f" font-size="11.5" text-anchor="middle">incident reports</text>

  <rect x="240" y="450" width="180" height="78" rx="7" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="330" y="472" fill="#4c1d95" font-size="12.5" font-weight="700" text-anchor="middle">CCTV (separate network)</text>
  <text x="330" y="490" fill="#4c1d95" font-size="11.5" text-anchor="middle">recorded on-site ·</text>
  <text x="330" y="506" fill="#4c1d95" font-size="11.5" text-anchor="middle">tamper-proof · alerts</text>

  <!-- Right side: layers legend -->
  <rect x="460" y="192" width="420" height="350" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="670" y="214" fill="#0f172a" font-size="14.5" font-weight="700" text-anchor="middle">Answer backup (the "Capsule") — 3 copies</text>
  <g font-size="12.5" fill="#1e293b">
    <rect x="480" y="230" width="380" height="50" rx="7" fill="#e0f2fe"/>
    <text x="494" y="251" font-weight="700">1. Exam machine disk</text>
    <text x="494" y="269">saved before "saved" is shown · survives a power cut</text>
    <rect x="480" y="290" width="380" height="50" rx="7" fill="#ccfbf1"/>
    <text x="494" y="311" font-weight="700">2. Edge primary + standby</text>
    <text x="494" y="329">updated within 1 second · survives a PC breaking</text>
    <rect x="480" y="350" width="380" height="50" rx="7" fill="#dbeafe"/>
    <text x="494" y="371" font-weight="700">3. Central</text>
    <text x="494" y="389">updated about every minute · survives losing the centre</text>
  </g>
  <text x="670" y="428" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Every backup is tiny, encrypted and digitally signed,</text>
  <text x="670" y="447" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">so it can't be read, changed or swapped for an old copy</text>
  <text x="670" y="480" fill="#334155" font-size="12.5" text-anchor="middle">Rule: every layer keeps working</text>
  <text x="670" y="497" fill="#334155" font-size="12.5" text-anchor="middle">if the layer above it disappears.</text>
  <text x="670" y="522" fill="#334155" font-size="12.5" text-anchor="middle">PCs work without the centre server; centres work without the internet</text>
</svg>
